name: Deploy static demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ocr_lab/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/ocr_lab/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application assets
        run: npm run build

      - name: Assemble read-only Pages artifact
        run: |
          mkdir -p pages/assets pages/templates
          cp github-pages/index.html pages/index.html
          cp public/favicon.svg pages/favicon.svg
          cp public/assets/template-first-local-workflow.png pages/assets/template-first-local-workflow.png
          cp public/assets/hr-document-intelligence-context.webp pages/assets/hr-document-intelligence-context.webp
          cp public/templates/*.docx pages/templates/
          touch pages/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/ocr_lab/web/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
