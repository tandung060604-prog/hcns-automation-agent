name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: >-
          ruff check src tests scripts
          apps/ocr_lab/api/canonical_phase_metrics.py
          apps/ocr_lab/api/local_server_security.py
          apps/ocr_lab/api/phase14_review_store.py
          apps/ocr_lab/api/upload_safety.py
      - run: mypy --python-version ${{ matrix.python-version }} src
      - run: python -m compileall -q apps/ocr_lab/api
      - run: python scripts/check_repository.py

  ocr-lab-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ocr_lab/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/ocr_lab/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm audit --omit=dev
