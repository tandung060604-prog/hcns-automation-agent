[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hcns-automation-agent"
version = "0.1.0"
description = "Human-in-the-loop agent for Vietnamese HR administration document workflows"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "HCNS Automation Agent Contributors" }]
dependencies = [
    "openpyxl>=3.1,<4",
    "Pillow>=10,<13",
    "PyMuPDF>=1.24,<2",
    "pypdfium2>=5,<6",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
paddle = ["numpy>=1.24,<3", "paddlepaddle>=3,<4", "paddleocr>=3.3,<4"]
mineru = [
    "mineru[pipeline]>=3.1,<4",
    "torch>=2.7,<2.8; sys_platform == 'win32'",
    "torchvision>=0.22,<0.23; sys_platform == 'win32'",
]
dev = ["ruff>=0.12,<1", "mypy>=1.16,<2", "pytest>=8,<9"]

[project.scripts]
hcns-agent-demo = "hcns_agent.demo:main"
hcns-agent-benchmark = "hcns_agent.benchmark_cli:main"
hcns-agent-recognition = "hcns_agent.recognition_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["hcns_agent"]
